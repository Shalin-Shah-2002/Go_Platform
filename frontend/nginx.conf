server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker service IPs can change when a container is recreated. Resolve the
    # service names through Docker DNS instead of keeping a stale IP forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $order_service_upstream order-service:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$order_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /connectors/ {
        set $debezium_upstream debezium:8083;
        proxy_pass http://$debezium_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
